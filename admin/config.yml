backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "einstellungen"
    label: "Webseite"
    files:
      - name: "shop"
        label: "Laden-Infos"
        file: "content/shop.json"
        fields:
          - { label: "Telefon", name: "telefon", widget: "string" }
          - { label: "E-Mail", name: "email", widget: "string" }
          - { label: "Öffnungszeiten", name: "oeffnungszeiten", widget: "text" }
          - { label: "Hinweis-Banner", name: "banner", widget: "string", required: false }
